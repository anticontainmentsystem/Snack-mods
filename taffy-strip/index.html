<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taffy Strip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav id="rail" aria-label="Shortcut cells" hidden></nav>
  <main id="panel" hidden>
    <header>
      <div><h1 id="title"></h1><span id="count"></span></div>
      <div class="header-actions"><button id="manage">Organize</button><button id="back" aria-label="Close cell">Close</button></div>
    </header>
    <div id="entries"></div>
    <section id="add-controls" hidden>
      <div class="add-buttons"><button id="files">Add file</button><button id="folder">Add folder</button><button id="drop">Drop a file</button></div>
      <form id="link-form"><label>Web link <input id="url" type="url" placeholder="https://…" required></label><button>Add link</button></form>
    </section>
    <footer id="editor-actions" hidden>
      <button id="clear-cache">Clear thumbnail cache</button>
      <div><button id="cancel">Cancel</button><button id="save" class="primary">Save cell</button></div>
    </footer>
  </main>
  <output id="status" role="status" hidden></output>
  <script src="script.js"></script>
</body>
</html>
