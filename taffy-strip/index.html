<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taffy Strip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav id="rail" aria-label="Shortcut cells" hidden></nav>
  <main id="panel" hidden>
    <header>
      <div><h1 id="title"></h1><span id="count"></span></div>
      <div class="header-actions"><button id="manage">Organize</button><button id="back" aria-label="Close cell">Close</button></div>
    </header>
    <div id="entries"></div>
    <section id="add-controls" hidden>
      <div class="add-header"><h2 id="add-title"></h2><button id="add-back" title="Back to spots" aria-label="Back to spots">←</button></div>
      <div class="add-buttons">
        <button id="files" title="Browse files or apps" aria-label="Browse files or apps">▤ <span>File</span></button>
        <button id="folder" title="Browse folders" aria-label="Browse folders">▰ <span>Folder</span></button>
        <button id="drop" title="Drop one target" aria-label="Drop one target">↓ <span>Drop</span></button>
      </div>
      <form id="link-form"><label><input id="url" aria-label="Web link" type="url" placeholder="https://…" required></label><button id="use-link">Add link</button></form>
    </section>
    <footer id="editor-actions" hidden>
      <button id="clear-cache">Clear thumbnail cache</button>
      <div><button id="cancel">Cancel</button><button id="save" class="primary">Save cell</button></div>
    </footer>
  </main>
  <output id="status" role="status" hidden></output>
  <script src="script.js"></script>
</body>
</html>
