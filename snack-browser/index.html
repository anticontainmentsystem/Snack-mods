<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snack Browser</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head><body>
<main><nav id="tabs" role="tablist" aria-label="Browser tabs"></nav><form id="navigation"><button type="button" id="home" title="Home" aria-label="Home"><img src="icon.svg" alt="Home" width="22" height="22"></button><button type="button" id="back" title="Back" aria-label="Back">‹</button><button type="button" id="forward" title="Forward" aria-label="Forward">›</button><button type="button" id="reload" title="Reload or stop" aria-label="Reload or stop">↻</button><input id="address" aria-label="Website address or search" placeholder="Search or enter an address" autocomplete="off" spellcheck="false"><button type="button" id="bookmark" title="Bookmark this page" aria-label="Bookmark this page">☆</button><button type="button" id="menu" title="Page menu" aria-label="Page menu">⋮</button></form>
<div id="tools"><button data-panel="bookmarks">Bookmarks</button><button data-panel="history">History</button><button data-panel="downloads">Downloads</button><button data-panel="extensions">Extensions</button><button data-panel="settings">Settings</button><button data-panel="agent">Agent desk</button><button data-panel="tools">Tools</button><button id="reopen" title="Reopen closed tab · Ctrl+Shift+T">Reopen</button><button id="duplicate">Duplicate</button><button id="pin">Pin tab</button><select id="zoom" aria-label="Page zoom"></select><button id="detach">Open as Snack ↗</button><button id="find">Find</button><button id="pdf">PDF</button><button id="screenshot">Capture</button></div>
<div id="find-row" hidden><input id="query" aria-label="Find text"><button id="find-previous" title="Previous match">‹</button><button id="find-next">Next</button><span id="find-count" aria-live="polite"></span><button id="find-close" aria-label="Close find">×</button></div>
<div id="extensions-bar" aria-label="Installed browser extensions"></div><section id="workspace"><aside id="inspector" hidden><header><strong id="panel-title"></strong><button id="panel-close" aria-label="Close panel">×</button></header><div id="tab-tools" hidden></div><div id="panel-content"></div></aside><div id="viewport"><section id="home-page" hidden><img src="icon.svg" alt="Snack Browser"><h1>Where shall we Snack?</h1><form id="home-search"><input id="home-query" type="search" required placeholder="Search the web or enter an address" aria-label="Search the web"><select id="home-engine" aria-label="Default search engine"><option value="google">Google</option><option value="duckduckgo">DuckDuckGo</option><option value="bing">Bing</option></select><button>Search</button></form><p>Your chosen search engine is also used in the address bar.</p></section><section id="empty"><img src="icon.svg" alt=""><h1>Room to explore.</h1><p>One browser for people and agents.<br>Open a tab to begin.</p><button id="first-tab">New tab</button></section></div></section><input id="bookmark-file" type="file" accept="application/json,text/html,.json,.html,.htm" hidden><footer><span id="status" role="status">Connecting to Snack…</span><span id="page-id"></span></footer></main><script src="model.js"></script><script src="script.js"></script></body></html>
