<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snack Browser</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head><body>
<main><nav id="tabs" aria-label="Browser tabs"></nav><form id="navigation"><button type="button" id="back" title="Back" aria-label="Back">‹</button><button type="button" id="forward" title="Forward" aria-label="Forward">›</button><button type="button" id="reload" title="Reload or stop" aria-label="Reload or stop">↻</button><input id="address" aria-label="Website address or search" placeholder="Search or enter an address" autocomplete="off" spellcheck="false"><button type="button" id="bookmark" title="Bookmark this page" aria-label="Bookmark this page">☆</button><button type="button" id="menu" title="Page menu" aria-label="Page menu">⋮</button></form>
<div id="tools"><button data-panel="bookmarks">Bookmarks</button><button data-panel="history">History</button><button data-panel="downloads">Downloads</button><button data-panel="agent">Agent desk</button><button id="detach">Open as Snack ↗</button><button id="find">Find</button><button id="pdf">PDF</button><button id="screenshot">Capture</button></div>
<div id="find-row" hidden><input id="query" aria-label="Find text"><button id="find-next">Next</button><button id="find-close" aria-label="Close find">×</button></div>
<section id="workspace"><aside id="inspector" hidden><header><strong id="panel-title"></strong><button id="panel-close" aria-label="Close panel">×</button></header><div id="panel-content"></div></aside><div id="viewport"><section id="empty"><img src="icon.svg" alt=""><h1>Room to explore.</h1><p>One browser for people and agents.<br>Open a tab to begin.</p><button id="first-tab">New tab</button></section></div></section><footer><span id="status" role="status">Connecting to Snack…</span><span id="page-id"></span></footer></main><script src="script.js"></script></body></html>
