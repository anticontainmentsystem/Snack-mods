<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snack Browser</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head><body>
<main><img id="brand-resource" src="icon.svg" alt="" hidden><nav id="tabs" role="tablist" aria-label="Browser tabs"></nav><div id="nav-stack"><form id="navigation"><button type="button" id="home" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m3 11 9-8 9 8M6 9v12h5v-7h3v7h4V9"/></svg></button><button type="button" id="back" title="Back" aria-label="Back">‹</button><button type="button" id="forward" title="Forward" aria-label="Forward">›</button><button type="button" id="reload" title="Reload or stop" aria-label="Reload or stop">↻</button><img id="address-favicon" src="icon.svg" alt="Page icon"><input id="address" aria-label="Website address or search" placeholder="Search or enter an address" autocomplete="off" spellcheck="false"><button type="button" id="bookmark" title="Bookmark this page" aria-label="Bookmark this page">☆</button><button type="button" id="menu" title="Page menu" aria-label="Page menu">⋮</button></form>
<div id="tools" hidden><button id="reopen" title="Reopen closed tab · Ctrl+Shift+T">Reopen</button><button id="duplicate">Duplicate</button><button id="pin">Pin tab</button><select id="zoom" aria-label="Page zoom"></select><button id="detach">Open as Snack ↗</button><button id="find">Find</button><button id="pdf">PDF</button><button id="screenshot">Capture</button></div>
<div id="find-row" hidden><input id="query" aria-label="Find text"><button id="find-previous" title="Previous match">‹</button><button id="find-next">Next</button><span id="find-count" aria-live="polite"></span><button id="find-close" aria-label="Close find">×</button></div>
</div><div id="browser-menu" hidden aria-label="Browser menu"><div class="menu-brand"><img src="icon.svg" alt="">Snack Browser</div><button data-panel="settings">Settings <span>Preferences &amp; privacy</span></button><button data-panel="tools">Tools <span>Page &amp; tab actions</span></button><button data-panel="extensions">Extensions <span>Install &amp; manage</span></button><hr><button data-panel="bookmarks">Bookmarks</button><button data-panel="history">History</button><button data-panel="downloads">Downloads</button><button data-panel="agent">Agent desk</button><hr><button id="native-menu">Website menu…</button></div><div id="quick-tools" hidden aria-label="Browser tools toolbar"></div><div id="extensions-bar" aria-label="Installed browser extensions"></div><section id="workspace"><section id="inspector" hidden aria-label="Browser page"><div class="page-shell"><header class="page-header"><div><div class="eyebrow">SNACK BROWSER</div><h1 id="panel-title"></h1><p id="page-description"></p></div><button id="panel-close" aria-label="Return to website" title="Return to website">×</button></header><div id="tab-tools" hidden></div><div id="panel-content"></div></div></section><div id="viewport"><section id="home-page" hidden><img src="icon.svg" alt="Snack Browser"><h1>Where shall we Snack?</h1><form id="home-search"><input id="home-query" type="search" required placeholder="Search the web or enter an address" aria-label="Search the web"><select id="home-engine" aria-label="Default search engine"><option value="google">Google</option><option value="duckduckgo">DuckDuckGo</option><option value="bing">Bing</option></select><button>Search</button></form><p>Your chosen search engine is also used in the address bar.</p></section><section id="empty"><img src="icon.svg" alt=""><h1>Room to explore.</h1><p>One browser for people and agents.<br>Open a tab to begin.</p><button id="first-tab">New tab</button></section></div></section><input id="bookmark-file" type="file" accept="application/json,text/html,.json,.html,.htm" hidden><footer><span id="status" role="status">Connecting to Snack…</span><span id="page-id"></span></footer></main><script src="model.js"></script><script src="script.js"></script></body></html>
