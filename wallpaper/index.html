<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallpaper</title><link rel="stylesheet" href="../condiments.css"><style>.wallpaper-board{display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1.2fr);gap:25px}.controls{padding:20px;border:1px solid var(--line)}.image-drop{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;width:100%;aspect-ratio:6/4;padding:20px;background:var(--soft);border:1px dashed var(--muted);text-align:center;overflow:hidden;position:relative}.image-drop img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.image-drop strong{font-size:17px;font-weight:500}.image-drop span{font-size:11px;color:var(--muted)}.image-preview{display:flex;align-items:center;justify-content:center;padding:20px;border:1px solid var(--line);min-height:250px}.preview-snack{width:70%;aspect-ratio:4/6;background:var(--soft);border:1px solid var(--line);background-size:cover;background-position:center;display:grid;place-content:center;max-height:350px}.preview-snack span{background:var(--bg);padding:8px 12px;color:var(--muted);font-size:11px}.image-name{margin-top:9px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.fit-pair{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}@media(max-width:550px){.wallpaper-board{grid-template-columns:1fr}.image-preview{min-height:170px}.preview-snack{aspect-ratio:6/4;max-height:200px}}</style></head><body><main class="page"><header class="page-head"><div><div class="eyebrow">CONDIMENT / WALLPAPER</div><h1>Make it yours.</h1><p>A background for any Snack.</p></div><span class="status" id="status" role="status"></span></header><section class="wallpaper-board"><div class="controls"><label>Snack<select id="target"></select></label><button class="image-drop field" id="choose"><strong>Drop an image</strong><span>or choose one</span><img id="picked-image" alt="Selected wallpaper" hidden></button><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden><p id="image-name" class="image-name">PNG, JPEG, WebP, GIF or AVIF · up to 10 MB</p><label class="field">Image fit<select id="fit"><option value="cover">Fill</option><option value="contain">Fit inside</option><option value="stretch">Stretch</option></select></label><div class="actions"><button id="apply" class="primary" disabled>Apply wallpaper</button><button id="remove">Remove</button></div></div><div class="image-preview"><div id="preview" class="preview-snack"><span>Snack preview</span></div></div></section></main><script src="wallpaper.js"></script></body></html>
