<!doctype html><html lang="en"><head><link rel="icon" type="image/svg+xml" href="snack-icon.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallpaper</title><link rel="stylesheet" href="styles.css"></head><body><main class="page"><header class="page-head"><div><div class="eyebrow">CONDIMENT / WALLPAPER</div><h1>Wallpaper</h1><p>A background for any Snack.</p></div><span class="status" id="status" role="status"></span></header><section class="wallpaper-board"><div class="controls"><label>Snack<select id="target"></select></label><button class="image-drop field" id="choose"><strong>Drop an image</strong><span>or choose one</span><img id="picked-image" alt="Selected wallpaper" hidden></button><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden><p id="image-name" class="image-name">PNG, JPEG, WebP, GIF or AVIF · up to 10 MB</p><button id="clear" disabled>Clear image</button><label class="field">Image fit<select id="fit"><option value="cover">Fill</option><option value="contain">Fit inside</option><option value="stretch">Stretch</option><option value="tile">Tile</option></select></label><div class="actions"><button id="apply" class="primary" disabled>Apply wallpaper</button><button id="remove">Remove</button></div></div><div class="image-preview"><div id="preview" class="preview-snack"><span>Snack preview</span></div></div></section></main><script src="script.js"></script></body></html>
